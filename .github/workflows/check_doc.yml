name: Check documentation

on:
  push:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/check_doc.yml'
      - 'ppanggolin/**'
      - 'setup.py'
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  generate-command-reference:
    if: >-
      github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'ppanggolin/') ||
        contains(github.event.head_commit.modified, 'setup.py') ||
        contains(github.event.head_commit.modified, 'pyproject.toml') ||
        contains(github.event.head_commit.added, 'ppanggolin/') ||
        contains(github.event.head_commit.added, 'setup.py') ||
        contains(github.event.head_commit.added, 'pyproject.toml')
      )
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: install ppanggolin with python deps and doc deps
      run: pip install .[doc]

    - name: regenerate command reference from CLI
      run: python docs/_scripts/generate_command_reference.py

    - name: commit generated docs if changed
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [[ -n "$(git status --porcelain -- docs/user/command_reference.md)" ]]; then
          git add docs/user/command_reference.md
          git commit -m "docs: regenerate command reference"
          git push origin HEAD:${GITHUB_REF_NAME}
        fi

  build-docs:
    if: >-
      github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'docs/') ||
        contains(github.event.head_commit.modified, '.readthedocs.yaml') ||
        contains(github.event.head_commit.modified, '.github/workflows/check_doc.yml') ||
        contains(github.event.head_commit.added, 'docs/') ||
        contains(github.event.head_commit.added, '.readthedocs.yaml') ||
        contains(github.event.head_commit.added, '.github/workflows/check_doc.yml')
      )
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: install ppanggolin with python deps and doc deps
      run: pip install .[doc]

    - name: Build documentation
      shell: bash -l {0}
      run: |
        cd docs/
        sphinx-build -b html . build/

    # Great extra actions to compose with:
    # Create an artifact of the html output.
    - uses: actions/upload-artifact@v4
      with:
        name: DocumentationHTML
        path: docs/build/
