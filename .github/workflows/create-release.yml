name: Create Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'Release ')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(cat VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' in VERSION file."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release PR version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^Release\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release PR title: '$PR_TITLE'"
            echo "::error::Expected: 'Release X.Y.Z'"
            exit 1
          fi

          PR_VERSION="${PR_TITLE#Release }"

          if [[ "$PR_VERSION" != "$VERSION" ]]; then
            echo "::error::Release version mismatch."
            echo "::error::PR title version: $PR_VERSION"
            echo "::error::VERSION file: $VERSION"
            exit 1
          fi

          echo "Release version confirmed: $VERSION"

      - name: Check tag does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Get previous release tag
        id: previous
        run: |
          PREVIOUS_TAG=$(git tag --list \
            --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${{ steps.version.outputs.version }}$" \
            | head -n 1)

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "::error::Could not find previous release tag."
            exit 1
          fi

          echo "Previous release: $PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"


      - name: Get release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json body \
            --jq '.body' > release-notes.md


      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "PPanGGOLiN $VERSION" \
            --draft \
            --notes-file release-notes.md